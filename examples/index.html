<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MossJS Web</title>
    <style>
        html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #111; }
        #moss { display: block; width: 100vw; height: 100vh; outline: none; }
    </style>
</head>
<body>
    <canvas id="moss" tabindex="0"></canvas>

    <script type="module">
        import createMossModule from "../dist/MossJS.js";
        import { createMoss } from "../web/moss.js";

        const Moss = await createMoss(createMossModule);
        const canvas = document.querySelector("#moss");

        const app = new Moss.Application({
            title: "MossJS Web",
            width: 1280,
            height: 720,
            canvas
        });

        canvas.addEventListener("click", () => app.focus());

        Moss.start(app, (dt) => {
            // Shared Moss game update/render code goes here.
            void dt;
        });
    </script>
</body>
</html>
