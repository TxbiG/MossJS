name: Deploy GitHub Pages

on:
  push:
    branches: [ main ] # Deploy automatically when code is pushed to main

# Set permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Ensure only one deployment runs at a time to prevent conflicts
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # VALIDATE AND BUILD
  # This job does all the heavy lifting. If anything fails, Job 2 never starts.
  build-and-validate:
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ job.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Emscripten toolchain
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Install Dependencies
        run: npm ci

      # Compiles C++/WebAssembly bindings. 
      # If your compiler throws an error here, the workflow exits instantly!
      - name: Build WebAssembly
        run: npm run build

      # Structure the deployment layout in a temporary staging directory
      # Includes a check to make sure examples/index.html actually exists to prevent 404s
      - name: Structure Pages Staging Directory
        run: |
          if [ ! -f "examples/index.html" ]; then
            echo "ERROR: examples/index.html missing! Aborting deployment to prevent 404."
            exit 1
          fi
          mkdir staging
          cp -r examples/* staging/
          cp -r performance staging/

      # Set up GitHub Pages infrastructure settings
      # Moved into the build block so settings are verified prior to bundling
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Package the aggregated staging directory
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './staging'

  # DEPLOY (Strictly Conditional)
  # This job will ONLY execute if Job 1 finishes with a perfect green checkmark.
  deploy:
    needs: build-and-validate # CRITICAL: Forces this job to wait for a successful build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Deploy the pre-compiled, verified artifact to the public live URL
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
