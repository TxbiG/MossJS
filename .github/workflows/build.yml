name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MossJS
        uses: actions/checkout@v4
        with:
          path: MossJS

      - name: Checkout Moss (dependency)
        uses: actions/checkout@v4
        with:
          repository: TxbiG/Moss
          path: Moss
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Verify Emscripten
        run: |
          emcc --version
          em++ --version

      # === ADDED DEBUGGING STEP HERE ===
      - name: Debug Directory Structure
        working-directory: MossJS
        run: |
          echo "=== Root Contents ==="
          ls -la
          echo "=== Src Contents ==="
          ls -la src/ || echo "src folder not found!"

      # This step comes next
      - name: Configure CMake
        working-directory: MossJS
        shell: bash
        run: |
          emcmake cmake \
            -S . \
            -B build-wasm \
            -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DMOSS_FRAMEWORK_DIR="${GITHUB_WORKSPACE}/Moss"

      - name: Build WebAssembly
        working-directory: MossJS
        run: cmake --build build-wasm --parallel

      - name: Upload WebAssembly build
        uses: actions/upload-artifact@v4
        with:
          name: MossJS-WASM
          path: |
            MossJS/dist/*.js
            MossJS/dist/*.wasm
